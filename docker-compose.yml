services:
  # Database (MySQL — MariaDB crashes with Bus error on this Docker/WSL setup)
  db:
    image: mysql:${MYSQL_VERSION:-8}
    container_name: ${PROJECT_NAME}_db
    # unless-stopped: auto-restart on crash; no restart after manual stop or make down/stop
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # MySQL 8.4 removed --ssl=0; require_secure_transport is off by default
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network

  # WordPress (PHP-FPM + Xdebug)
  wordpress:
    build:
      context: ./php
    container_name: ${PROJECT_NAME}_wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      # WordPress installation variables
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      SITE_HOSTNAME: ${SITE_HOSTNAME}
      # User and group IDs for file permissions
      UID: ${UID}
      GID: ${GID}
      # WordPress debug (from .env)
      WP_DEBUG: ${WP_DEBUG:-false}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-false}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-false}
    volumes:
      # WordPress core (downloaded on first run)
      - wordpress_core:/var/www/html
      # Themes and plugins for development
      - ./themes:/var/www/html/wp-content/themes
      - ./plugins:/var/www/html/wp-content/plugins
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      # WordPress debug.log (visible on host in ./logs)
      - ./logs:/var/www/html/wp-content/debug-logs
      # php.ini with Xdebug settings
      - ./php/php.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    networks:
      - wordpress_network

  # Web server (Nginx)
  nginx:
    image: nginx:latest
    container_name: ${PROJECT_NAME}_nginx
    restart: unless-stopped
    volumes:
      - wordpress_core:/var/www/html
      - ./themes:/var/www/html/wp-content/themes:ro # :ro — read-only for Nginx
      - ./plugins:/var/www/html/wp-content/plugins:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - SITE_HOSTNAME=${SITE_HOSTNAME}
    command: /bin/sh -c "envsubst '$$SITE_HOSTNAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - wordpress
    networks:
      - wordpress_network
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-nginx.rule=Host(`${SITE_HOSTNAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-nginx.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-nginx.tls=true"
      - "traefik.http.services.${PROJECT_NAME}-nginx.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_web"

  # Database management (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${PROJECT_NAME}_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: ${DB_HOST}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - wordpress_network
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-pma.rule=Host(`${PMA_HOSTNAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-pma.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-pma.tls=true"
      - "traefik.http.services.${PROJECT_NAME}-pma.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_web"

# Named volumes for persistent data
volumes:
  db_data:
  wordpress_core:

# Network between containers
networks:
  wordpress_network:
    driver: bridge
  traefik_web:
    external: true
